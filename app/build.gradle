plugins {
    id 'com.android.application'
}

// One fixed signing key, kept in the repo, so every build — here or on GitHub —
// produces an APK that Android accepts as an update of the last one. Without it
// each build machine invents a throwaway key and the phone refuses to install
// over the existing app.
def signingKey = rootProject.file('signing/bagweigher.jks')

// Each GitHub build gets a higher version code than the one before, so the
// phone always sees a new APK as newer. Local builds fall back to 1.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int

android {
    namespace 'com.toddle.bagweigher'
    compileSdk 35

    defaultConfig {
        applicationId "com.toddle.bagweigher"
        minSdk 24
        targetSdk 35
        versionCode 100 + buildNumber
        versionName "1.2"
    }

    signingConfigs {
        shared {
            if (signingKey.exists()) {
                storeFile signingKey
                storePassword 'bagweigher'
                keyAlias 'bagweigher'
                keyPassword 'bagweigher'
            }
        }
    }

    buildTypes {
        debug {
            if (signingKey.exists()) {
                signingConfig signingConfigs.shared
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingKey.exists()) {
                signingConfig signingConfigs.shared
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX drags in two Kotlin standard libraries (1.8.22 and an older
    // 1.6.0 jdk7/jdk8 pair) whose classes overlap, which fails the build at
    // checkDebugDuplicateClasses. The BOM pins them all to one version.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
