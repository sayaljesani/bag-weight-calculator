name: Build APK

# Runs on every push, and whenever you press "Run workflow" in the Actions tab.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write        # needed to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Make sure the SDK platform is installed
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename it with the run number
        id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/BagWeightCalculator-v${{ github.run_number }}.apk"
          echo "path=out/BagWeightCalculator-v${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Route 1: download from the run page (arrives as a .zip)
      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: BagWeightCalculator-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Route 2: a Release, so the phone can download the .apk directly
      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" \
            "${{ steps.apk.outputs.path }}" \
            --title "Bag Weight Calculator ${{ steps.apk.outputs.tag }}" \
            --notes "Debug build from commit ${{ github.sha }}. Open this page on the phone and tap the .apk to install." \
            || gh release upload "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.path }}" --clobber
